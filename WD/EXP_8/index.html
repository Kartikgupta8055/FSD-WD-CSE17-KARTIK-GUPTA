<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background Image Example</title>
    <style>
        body {
            background-image: url('css_image.jpg');
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-position: center;
            font-family: Arial, sans-serif;
            color: white;
            text-align: center;
            margin: 0;
            padding: 0;
        }

        h1 {
            margin-top: 150px;
            font-size: 50px;
            text-shadow: 2px 2px 8px black;
        }

        p {
            font-size: 22px;
            width: 60%;
            margin: 20px auto;
            background-color: rgba(0, 0, 0, 0.5);
            padding: 15px;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <h1>Welcome to My Web Page</h1>
    <p>This page has a beautiful background image applied using CSS.</p>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hover Effect</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #f0f0f0;
      font-family: Arial, sans-serif;
    }

    .box {
      background-color: blue;
      color: white;
      padding: 30px 60px;
      border-radius: 10px;
      font-size: 20px;
      transition: all 0.3s ease;
    }

    .box:hover {
      background-color: green;
      transform: scale(1.1);
      
    }
  </style>
</head>
<body>
  <div class="box">Hover over m!</div>
</body>
</html>
